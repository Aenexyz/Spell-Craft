<title>Fusebound</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze:wght@500;700&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: route rail on top, a pixel-art stage where the duel plays out, the info panels, the forge (two slots), then your hand. */
:root{
  --felt:#0d1618; --felt-2:#132124; --panel:#182a2e; --panel-2:#1f353a; --line:#2d454b;
  --ink:#ece6d6; --muted:#8fa5a4; --brass:#dba64b; --brass-dim:#7d5d27;
  --danger:#e8574d; --ok:#62d394;
  --phys:#c8cdd8; --fire:#ff7b3a; --ice:#82d4ff; --thunder:#f2d24b; --earth:#c09461; --holy:#fff0b3; --shadow:#b18bff; --guard:#59c9c2; --mend:#7fe08a;
  --rare:#7db8ff; --epic:#cf9bff;
  --f-display:'Grenze', Georgia, 'Times New Roman', serif;
  --f-body:'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-num:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{background:var(--felt);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;
  background:radial-gradient(1200px 600px at 50% -10%, #1b3236 0%, transparent 60%), var(--felt)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
#app{max-width:1080px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
#top,#main{display:flex;flex-direction:column;gap:14px;min-width:0}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
.eyebrow{font-family:var(--f-num);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:30px;color:var(--brass)}
.top-actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel-2);border-color:var(--brass-dim)}
.btn-primary{background:var(--brass);color:#1a1206;border-color:var(--brass)}
.btn-primary:hover{background:#e9b85e;border-color:#e9b85e}
.btn:disabled{opacity:.4;cursor:not-allowed}
.route{display:flex;align-items:center;overflow-x:auto;padding:6px 2px 8px;scrollbar-width:thin}
.node{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:62px}
.node-dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--felt-2);display:grid;place-items:center;font-family:var(--f-num);font-size:12px;font-weight:700;color:var(--muted)}
.node.ev .node-dot{border-radius:4px;transform:rotate(45deg)}
.node.ev .node-dot span{transform:rotate(-45deg)}
.node.boss .node-dot{width:32px;height:32px;border-color:var(--fire);color:var(--fire)}
.node.done .node-dot{background:var(--brass-dim);border-color:var(--brass-dim);color:var(--ink)}
.node.cur .node-dot{border-color:var(--brass);color:var(--brass);box-shadow:0 0 0 4px rgba(219,166,75,.18)}
.node-label{font-size:11px;color:var(--muted);white-space:nowrap}
.node.cur .node-label{color:var(--ink);font-weight:600}
.link{flex:1 0 14px;height:2px;background:var(--line);min-width:14px}
.link.done{background:var(--brass-dim)}

/* stage */
.stage-wrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:2.4/1;background:#7fb6dc;box-shadow:0 10px 30px #0007}
.stage-wrap canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.stage-label{position:absolute;left:12px;top:10px;background:#0d1618cc;border:1px solid #ffffff22;border-radius:6px;padding:4px 10px;font-family:var(--f-num);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);pointer-events:none}
.stage-label:empty{display:none}

.arena{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;position:relative;min-width:0}
.enemy-name{font-size:26px;line-height:1.1}
.lore{color:var(--muted);font-size:13px;margin:2px 0 10px}
.bar{height:12px;background:var(--felt);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#b8403a,var(--danger));transition:width .4s ease}
.bar.me>i{background:linear-gradient(90deg,#3c9f69,var(--ok))}
.hp-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;font-size:13px}
.hp-row .num{font-size:16px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-family:var(--f-num);font-size:12px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--felt-2);display:inline-flex;align-items:center;gap:4px}
.chip svg{width:12px;height:12px}
.chip.weak{border-color:color-mix(in srgb,var(--ok) 60%,transparent);color:var(--ok)}
.chip.res{border-color:color-mix(in srgb,var(--danger) 55%,transparent);color:#f0928a}
.chip.imm{border-color:var(--muted);color:var(--muted);text-decoration:line-through}
.chip.unk{color:var(--muted);border-style:dashed}
.chip.st{border-color:var(--tc);color:var(--tc)}
.aff{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin-top:10px;font-size:12px}
.aff .chips{margin:0}
.intent{display:flex;align-items:center;gap:10px;margin-top:12px;padding:8px 10px;border-radius:8px;background:var(--felt-2);border:1px solid var(--line)}
.intent b{font-family:var(--f-num);font-size:18px;letter-spacing:.02em}
.intent.heavy{border-color:color-mix(in srgb,var(--danger) 60%,transparent)}
.player h3{font-size:20px;margin-bottom:8px}
.stat-line{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.stat-line b{color:var(--ink);font-family:var(--f-num);font-size:16px}
.block-badge{display:inline-flex;align-items:center;gap:4px;color:var(--guard);font-family:var(--f-num);font-weight:700;font-size:16px}
.block-badge svg{width:16px;height:16px}
.log{margin-top:12px;max-height:150px;overflow-y:auto;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:10px}
.log p{margin:0}
.log p:first-child{color:var(--ink)}
.log .w{color:var(--ok)} .log .r{color:#f0928a}

.forge{display:grid;grid-template-columns:auto auto auto auto minmax(0,1fr);gap:12px;align-items:center}
.slot{width:96px;height:132px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:6px;background:var(--felt-2)}
.slot .card{width:100%;height:100%}
.slot.filled{border:none;padding:0;background:none}
.op{font-family:var(--f-display);font-size:30px;color:var(--brass)}
.result{min-width:0}
.result h3{font-size:24px;color:var(--brass);line-height:1.1}
.result .eyebrow{margin-bottom:2px}
.result ul{margin:8px 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.result li{display:flex;gap:8px;align-items:center}
.result li svg{width:14px;height:14px;flex:0 0 auto}
.result .est{font-family:var(--f-num);font-size:20px;font-weight:700}
.result-actions{display:flex;gap:8px;flex-wrap:wrap}
.new-tag{font-family:var(--f-num);font-size:11px;letter-spacing:.12em;background:var(--brass);color:#1a1206;padding:1px 6px;border-radius:3px;vertical-align:middle;margin-left:6px}
.empty-hint{color:var(--muted);font-size:14px;max-width:46ch;margin:0}

.hand{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.card{--tc:var(--phys);width:112px;height:156px;border-radius:10px;border:1px solid color-mix(in srgb,var(--tc) 45%,var(--line));
  background:linear-gradient(170deg,color-mix(in srgb,var(--tc) 22%,var(--panel)) 0%,var(--panel) 55%,var(--felt-2) 100%);
  display:flex;flex-direction:column;align-items:stretch;padding:8px;gap:2px;cursor:pointer;text-align:left;position:relative;
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 18px #0008}
.card.is-sel{transform:translateY(-10px);border-color:var(--brass);box-shadow:0 0 0 2px var(--brass),0 10px 22px #000a}
.card-top{display:flex;justify-content:space-between;align-items:center}
.card-cat{font-family:var(--f-num);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tc)}
.card-pow{font-family:var(--f-num);font-weight:700;font-size:15px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--felt);border:1px solid color-mix(in srgb,var(--tc) 60%,transparent)}
.card-icon{flex:1;display:grid;place-items:center;color:var(--tc)}
.card-icon svg{width:44px;height:44px}
.card-name{font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1}
.card-name i{font-style:normal;color:var(--brass);font-family:var(--f-num);font-size:14px}
.card-desc{font-size:11px;color:var(--muted);line-height:1.25;min-height:2.5em}
.hand-meta{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--muted);margin-top:10px}
.hand.locked .card{opacity:.55;pointer-events:none}
.item-ic{display:inline-block;flex:0 0 auto;background-image:var(--items-url);background-repeat:no-repeat;filter:drop-shadow(0 2px 2px #0009)}
.loot{display:flex;gap:16px;align-items:center;padding:14px 16px;border-radius:10px;background:var(--felt-2);border:1px solid var(--line);max-width:680px;flex-wrap:wrap}
.loot.rare{border-color:color-mix(in srgb,var(--rare) 55%,transparent);box-shadow:inset 0 0 24px color-mix(in srgb,var(--rare) 12%,transparent)}
.loot.epic{border-color:color-mix(in srgb,var(--epic) 60%,transparent);box-shadow:inset 0 0 28px color-mix(in srgb,var(--epic) 16%,transparent)}
.loot-body{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.loot-body h3{font-size:22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.loot-body p{margin:0}
.rar{font-family:var(--f-num);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:1px 7px;border-radius:3px;border:1px solid currentColor}
.rar.common{color:var(--muted)} .rar.rare{color:var(--rare)} .rar.epic{color:var(--epic)}
.stats{margin:2px 0;padding:0;list-style:none;font-size:14px;color:var(--ok);display:flex;flex-direction:column;gap:2px}
.compare{font-size:12px;color:var(--muted)}
.gear{display:flex;flex-wrap:wrap;gap:6px}
.slotbox{width:38px;height:38px;border-radius:6px;border:1px solid var(--line);background:var(--felt);display:grid;place-items:center}
.slotbox.rare{border-color:color-mix(in srgb,var(--rare) 60%,transparent)} .slotbox.epic{border-color:color-mix(in srgb,var(--epic) 60%,transparent)}
.slotbox.empty{border-style:dashed;opacity:.45;font-family:var(--f-num);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1.05}
.gear-sum{font-size:12px;color:var(--muted);margin-top:6px}
.gear-sum b{color:var(--ink);font-family:var(--f-num);font-size:14px}

.screen{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:16px}
.screen h2{font-size:32px;color:var(--brass)}
.screen p{margin:0;max-width:62ch}
.options{display:flex;flex-direction:column;gap:10px;max-width:560px}
.opt{text-align:left;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--felt-2);cursor:pointer}
.opt:hover{border-color:var(--brass-dim);background:var(--panel-2)}
.opt b{display:block;font-size:16px}
.opt span{font-size:13px;color:var(--muted)}
.card-row{display:flex;flex-wrap:wrap;gap:12px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.rule{background:var(--felt-2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px}
.rule b{display:block;font-family:var(--f-display);font-size:18px;color:var(--brass);margin-bottom:2px}
.example{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.example .card{width:96px;height:134px;cursor:default}
.example .card:hover{transform:none;box-shadow:none}
.example .eq{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--brass)}
.travel{display:flex;align-items:center;gap:12px;color:var(--muted)}
.travel b{color:var(--ink)}

.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:20;padding:16px}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:760px;width:100%;max-height:85vh;overflow-y:auto;padding:22px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.codex{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.codex div{background:var(--felt-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px}
.codex b{display:block;font-family:var(--f-display);font-size:17px}
.codex span{color:var(--muted)}
.guide{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.guide td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}
.guide td:first-child{white-space:nowrap;font-weight:600}

@media (max-width:760px){
  .stage-wrap{aspect-ratio:1.55/1}
  .arena{grid-template-columns:1fr}
  .forge{grid-template-columns:auto auto auto auto;justify-content:center}
  .forge .result{grid-column:1/-1}
  .slot{width:82px;height:114px}
  .card{width:96px;height:138px}
  .card-icon svg{width:36px;height:36px}
  .enemy-name{font-size:22px}
  .screen{padding:18px}
}
@media (prefers-reduced-motion:reduce){.card,.bar>i{transition:none}}
</style>

<div id="app">
  <div id="top"></div>
  <div class="stage-wrap"><canvas id="stage" aria-label="Battle scene"></canvas><div class="stage-label" id="stageLabel"></div></div>
  <div id="main"></div>
  <div id="modal"></div>
</div>

<script>
/*__ASSETS__*/
(()=>{
try{document.documentElement.style.setProperty('--items-url',`url("${ASSET.items}")`)}catch(e){}
/* ================= data ================= */
const ICONS={
  slash:'<path d="M4 18C10 16 16 10 18 4"/><path d="M8 21C14 19 19 13 21 7" opacity=".55"/>',
  pierce:'<path d="M3 21L19 5"/><path d="M12 4h8v8"/>',
  blunt:'<path d="M14 3l7 7-3 3-7-7z"/><path d="M12.5 8.5L4 17l3 3 8.5-8.5"/>',
  fire:'<path d="M12 3c1 4 6 6 6 11a6 6 0 01-12 0c0-3 2-4 2-7 2 1 3 3 3 5 1-2 1-6 1-9z"/>',
  ice:'<path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 4l3 2 3-2M9 20l3-2 3 2"/>',
  thunder:'<path d="M13 2L5 14h6l-1 8 8-12h-6z"/>',
  earth:'<path d="M2 20L9 8l4 6 3-4 6 10z"/>',
  holy:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
  shadow:'<path d="M15 3a9 9 0 100 18 7 7 0 010-18z"/>',
  guard:'<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/>',
  mend:'<path d="M12 21s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z"/>'
};
const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;
const COLOR={slash:'phys',pierce:'phys',blunt:'phys',fire:'fire',ice:'ice',thunder:'thunder',earth:'earth',holy:'holy',shadow:'shadow',guard:'guard',mend:'mend'};
const HEX={phys:'#e6e9f0',fire:'#ff7b3a',ice:'#82d4ff',thunder:'#f2d24b',earth:'#c09461',holy:'#fff0b3',shadow:'#b18bff',guard:'#59c9c2',mend:'#7fe08a'};
const hexOf=t=>HEX[COLOR[t]];
const CARDS={
  slash:{name:'Slash',cat:'tech',pow:5,desc:'Cutting technique.'},
  pierce:{name:'Pierce',cat:'tech',pow:5,desc:'Thrusting technique.'},
  blunt:{name:'Smash',cat:'tech',pow:6,desc:'Crushing technique.'},
  fire:{name:'Fire',cat:'elem',pow:4,desc:'Burns for 2 turns.'},
  ice:{name:'Ice',cat:'elem',pow:4,desc:'Chills the next enemy hit.'},
  thunder:{name:'Thunder',cat:'elem',pow:4,desc:'35% chance to stun.'},
  earth:{name:'Earth',cat:'elem',pow:4,desc:'Grants 4 block.'},
  holy:{name:'Holy',cat:'elem',pow:4,desc:'Heals you 3.'},
  shadow:{name:'Shadow',cat:'elem',pow:4,desc:'Curses: foe takes +30%.'},
  guard:{name:'Guard',cat:'util',pow:6,desc:'Fuse for block.'},
  mend:{name:'Mend',cat:'util',pow:6,desc:'Fuse for healing.'}
};
const CATLABEL={tech:'Technique',elem:'Element',util:'Support'};
const CO={tech:0,elem:1,util:2};
const ADJ={fire:'Burning',ice:'Frost',thunder:'Thunder',earth:'Quake',holy:'Radiant',shadow:'Umbral'};
const NOUN={slash:'Slash',pierce:'Lance',blunt:'Crush'};
const SAME={fire:'Inferno',ice:'Blizzard',thunder:'Tempest',earth:'Landslide',holy:'Halo Nova',shadow:'Abyss',slash:'Double Slash',pierce:'Twin Lance',blunt:'Hammerfall'};
const PAIR={'fire+ice':'Steam Burst','fire+thunder':'Plasma Bolt','earth+fire':'Magma Surge','fire+holy':'Sunflare','fire+shadow':'Hellfire',
  'ice+thunder':'Glacial Storm','earth+ice':'Permafrost','holy+ice':'Diamond Dust','ice+shadow':'Black Frost','earth+thunder':'Fulgurite',
  'holy+thunder':'Judgment','shadow+thunder':'Void Bolt','earth+holy':'Sanctum Stone','earth+shadow':'Grave Tremor','holy+shadow':'Eclipse',
  'pierce+slash':'Rending Thrust','blunt+slash':'Cleaver Rush','blunt+pierce':'Spike Hammer'};
const FXTEXT={fire:'Burn: 3 damage at the start of its turn, 2 turns',ice:'Chill: its next attack deals 40% less',thunder:'35% chance to stun (skips its turn)',earth:'You gain 4 block',holy:'You heal 3',shadow:'Curse: it takes 30% more from your next 2 fusions'};
const TYPENAME={slash:'Slash',pierce:'Pierce',blunt:'Blunt',fire:'Fire',ice:'Ice',thunder:'Thunder',earth:'Earth',holy:'Holy',shadow:'Shadow'};

const ENEMIES={
  thornling:{name:'Toadstool',hp:22,tint:null,lore:'A red-capped wanderer. Its dry stem snaps easily.',mods:{fire:2,slash:2,earth:.5,blunt:.5},pattern:[['atk',4],['atk',5],['def',4]]},
  slime:{name:'Bog Cap',hp:26,tint:{h:105,s:.85,l:-.03},lore:'Soaked through and slick. Blades slide right off.',mods:{thunder:2,fire:1.5,slash:.5,pierce:.5},pattern:[['atk',5],['drain',4],['atk',6]]},
  wolf:{name:'Ember Cap',hp:30,tint:{h:28,s:1,l:.04},lore:'Grew in the ashes of a burned grove. Still warm.',mods:{ice:2,fire:.5,shadow:.5},pattern:[['atk',5],['multi',3,2],['heavy',9]]},
  knight:{name:'Rust Cap',hp:40,tint:{h:18,s:.5,l:-.13},lore:'Its cap has hardened like old iron. The stem is corroded.',mods:{thunder:2,blunt:2,slash:.5,pierce:.5,ice:.5},pattern:[['def',8],['atk',7],['heavy',12],['atk',6]]},
  wraith:{name:'Frost Cap',hp:38,tint:{h:195,s:.75,l:.1},stem:{h:200,s:.35,l:.02},lore:'Cold to the touch. Steel glances off its frozen skin.',mods:{fire:2,holy:2,ice:0,slash:.5,pierce:.5,blunt:.5},pattern:[['atk',6],['drain',5],['buff',2],['heavy',11]]},

  if(R.parts.length&&g.atk)R.parts[0].p+=g.atk;

function fuse(c1,c2){
  const [a,b]=[c1,c2].sort((x,y)=>CO[D(x).cat]-CO[D(y).cat]||x.key.localeCompare(y.key));
  const A=D(a),pa=pow(a),pb=pow(b);
  const r={parts:[],block:0,heal:0,fx:[],breaker:false,key:a.key+'+'+b.key};
  const cats=A.cat+'+'+D(b).cat;
  if(cats==='tech+elem'){r.name=`${ADJ[b.key]} ${NOUN[a.key]}`;r.parts=[{t:a.key,p:pa},{t:b.key,p:pb+2}];r.fx=[b.key]}
  else if(cats==='elem+elem'){
    if(a.key===b.key){r.name=SAME[a.key];r.parts=[{t:a.key,p:Math.round((pa+pb)*1.3)}];r.fx=[a.key,a.key]}
    else{r.name=PAIR[r.key];r.parts=[{t:a.key,p:pa+1},{t:b.key,p:pb+1}];r.fx=[a.key,b.key]}
  }
  else if(cats==='tech+tech'){
    r.breaker=true;
    if(a.key===b.key){r.name=SAME[a.key];r.parts=[{t:a.key,p:Math.round((pa+pb)*1.15)}]}
    else{r.name=PAIR[r.key];r.parts=[{t:a.key,p:pa},{t:b.key,p:pb}]}
  }
  else if(cats==='tech+util'){
    if(b.key==='guard'){r.name=`Parry ${NOUN[a.key]}`;r.block=pb;r.parts=[{t:a.key,p:Math.round(pa*.7)}]}
    else{r.name=`Leeching ${NOUN[a.key]}`;r.heal=Math.round(pb*.6);r.parts=[{t:a.key,p:pa}]}
  }
  else if(cats==='elem+util'){
    if(b.key==='guard'){r.name=`${A.name} Ward`;r.block=pb+2;r.parts=[{t:a.key,p:Math.round(pa*.5)}];r.fx=[a.key]}
    else{r.name=`${ADJ[a.key]} Remedy`;r.heal=pb;r.parts=[{t:a.key,p:Math.round(pa*.6)}];r.fx=[a.key]}
  }
  else{
    if(a.key==='guard'&&b.key==='guard'){r.name='Fortress';r.block=pa+pb+2}
    else if(a.key==='mend'&&b.key==='mend'){r.name='Renewal';r.heal=pa+pb}
    else{r.name='Second Wind';r.block=pa;r.heal=Math.round(pb*.7)}
  }
  return r;
}

/* ================= flow ================= */
function travel(){
  const n=ROUTE[S.node];
  S.phase='travel';S.busy=true;S.sel=[];render();
  Stage.walkTo(n,()=>startNode());
}
function startNode(){
  const n=ROUTE[S.node];
  if(n.k==='e')startBattle(n.id); else startEvent(n.id);
}
function startBattle(id){
  const d=ENEMIES[id];
  S.enemy={id,hp:d.hp,max:d.hp,block:0,str:0,burn:0,chill:0,curse:0,stun:false,step:0,known:[],enraged:false};
  S.draw=shuffle(S.deck.map(c=>c.id));S.hand=[];S.disc=[];S.sel=[];S.block=stats().def;S.busy=false;
  S.log=[`${d.name} blocks the road.`];
  drawHand();S.phase='battle';render();
}
function drawHand(){
  while(S.hand.length<HAND&&(S.draw.length||S.disc.length)){
    if(!S.draw.length){S.draw=shuffle(S.disc);S.disc=[]}
    S.hand.push(S.draw.pop());
  }
}
function log(s){S.log.unshift(s);if(S.log.length>40)S.log.pop()}
function intentOf(E){const p=ENEMIES[E.id].pattern;return p[E.step%p.length]}
function intentText(E){
  const [t,v,n]=intentOf(E);const s=E.str;const ch=x=>E.chill?Math.round(x*.6):x;
  switch(t){
    case 'atk':return{label:'Attack',val:ch(v+s),cls:''};
    case 'heavy':return{label:'Heavy blow',val:ch(v+s),cls:'heavy'};
    case 'multi':return{label:'Flurry',val:`${ch(v+s)} × ${n}`,cls:''};
    case 'drain':return{label:'Drain',val:ch(v+s),cls:''};
    case 'def':return{label:'Brace',val:`+${v} block`,cls:''};
    case 'buff':return{label:'Empower',val:`+${v} attack`,cls:''};
    case 'heal':return{label:'Recover',val:`+${v} HP`,cls:''};
  }
}

function doFuse(){
  if(S.busy||S.sel.length<2)return;
  S.busy=true;
  const [c1,c2]=S.sel.map(card);
  const R=gearFuse(c1,c2);
  render();
  const ts=R.parts.map(p=>p.t);
  const kind=(R.breaker||ts.includes('blunt'))?'kick':'punch';
  if(R.parts.length){Stage.playerAttack(ts,kind);setTimeout(()=>applyFuse(c1,c2,R),380)}
  else{Stage.playerCast([R.block?'#59c9c2':'#7fe08a',R.heal?'#7fe08a':'#59c9c2'],R.block?'block':'celebrate');setTimeout(()=>applyFuse(c1,c2,R),300)}
}
function applyFuse(c1,c2,R){
  const E=S.enemy,def=ENEMIES[E.id];
  if(!S.codex.some(x=>x.key===R.key))S.codex.push({key:R.key,name:R.name,a:D(c1).name,b:D(c2).name});
  let total=0;const notes=[];
  R.parts.forEach((part,i)=>{
    const m=def.mods[part.t]??1;
    if(!E.known.includes(part.t))E.known.push(part.t);
    let d=part.p*m;if(E.curse>0)d*=1.3;d=Math.round(d);total+=d;
    const tag=m===0?'IMMUNE':m>=2?'WEAK!':m>1?'WEAK':m<1?'RESIST':'';
    if(tag==='IMMUNE')notes.push(`<span class="r">${TYPENAME[part.t]} had no effect</span>`);
    else if(m>1)notes.push(`<span class="w">${TYPENAME[part.t]} hit a weakness</span>`);
    else if(m<1)notes.push(`<span class="r">${TYPENAME[part.t]} was resisted</span>`);
    Stage.float('enemy',d,hexOf(part.t),tag,i*140);
  });
  if(R.parts.length)Stage.hitEnemy(R.parts.map(p=>p.t));
  if(E.curse>0)E.curse--;
  if(!R.breaker&&E.block>0){const ab=Math.min(E.block,total);E.block-=ab;total-=ab;if(ab)notes.push(`${ab} absorbed by its block`)}
  else if(R.breaker&&E.block>0)notes.push('broke through its block');
  if(R.parts.length)E.hp-=total;
  if(R.block){S.block+=R.block;Stage.float('player',`+${R.block}`,'#59c9c2','BLOCK');Stage.playerBurst('#59c9c2')}
  if(R.heal){const h=Math.min(R.heal,S.maxHp-S.hp);S.hp+=h;Stage.float('player',`+${h}`,'#7fe08a','HEAL',R.block?160:0);Stage.playerBurst('#7fe08a')}
  R.fx.forEach(f=>{
    if(def.mods[f]===0)return;
    if(f==='fire')E.burn+=2;
    if(f==='ice')E.chill=Math.min(2,E.chill+1);
    if(f==='thunder'&&Math.random()<.35){E.stun=true;notes.push('<span class="w">stunned it</span>');Stage.float('enemy','STUN','#f2d24b','',300)}
    if(f==='earth'){S.block+=4;Stage.playerBurst('#c09461')}
    if(f==='holy'){S.hp=Math.min(S.maxHp,S.hp+3);Stage.playerBurst('#fff0b3')}
    if(f==='shadow')E.curse+=2;
  });
  log(`${D(c1).name} + ${D(c2).name} → <b>${R.name}</b>${R.parts.length?` for ${total}`:''}${notes.length?'. '+notes.join(', '):''}.`);
  S.hand=S.hand.filter(id=>!S.sel.includes(id));S.disc.push(...S.sel);S.sel=[];
  if(def.boss&&!E.enraged&&E.hp>0&&E.hp<=E.max/2){E.enraged=true;E.str+=3;log('<span class="r">The Ember Monarch enrages! Its attacks grow stronger.</span>');Stage.enemyBurst('#ff7b3a',30)}
  render();
  if(E.hp<=0){Stage.enemyDie();setTimeout(winBattle,1100)}else setTimeout(enemyTurn,750);
}

function hurtPlayer(x,delay){
  const E=S.enemy;if(E.chill)x=Math.round(x*.6);
  const ab=Math.min(S.block,x);S.block-=ab;const d=x-ab;S.hp-=d;
  setTimeout(()=>Stage.hitPlayer(!d),delay||0);
  Stage.float('player',d?`-${d}`:'0',d?'#ff6b5e':'#59c9c2',ab?`${ab} BLOCKED`:'',delay);
  return d;
}
function enemyTurn(){
  const E=S.enemy,def=ENEMIES[E.id];
  E.block=0;let wait=0;
  if(E.burn>0){const m=def.mods.fire??1;const d=Math.round(3*m);E.hp-=d;E.burn--;log(`Burn deals ${d}.`);Stage.float('enemy',d,'#ff7b3a','BURN');Stage.enemyBurst('#ff7b3a',14);
    render();if(E.hp<=0){Stage.enemyDie();setTimeout(winBattle,1100);return}wait=550}
  setTimeout(enemyAct,wait);
}
function enemyAct(){
  const E=S.enemy,def=ENEMIES[E.id];let wait=500;
  if(E.stun){E.stun=false;log(`${def.name} is stunned and loses its turn.`);E.step++;Stage.float('enemy','STUNNED','#f2d24b','');render();setTimeout(endEnemyTurn,700);return}
  const [t,v,n]=intentOf(E);E.step++;const s=E.str;
  if(t==='atk'||t==='heavy'||t==='drain'||t==='multi'){
    Stage.enemyAttack(t==='heavy'?700:t==='multi'?520+n*90:560);
    const hitAt=t==='heavy'?300:240;
    setTimeout(()=>{
      if(t==='multi'){let sum=0;for(let i=0;i<n;i++)sum+=hurtPlayer(v+s,i*110);log(`${def.name} strikes ${n} times for ${sum}.`)}
      else{const d=hurtPlayer(v+s);
        if(t==='drain'){E.hp=Math.min(E.max,E.hp+d);log(`${def.name} drains ${d} HP from you.`);if(d){Stage.float('enemy',`+${d}`,'#7fe08a','',250);Stage.enemyBurst('#b18bff')}}
        else log(`${def.name} ${t==='heavy'?'lands a heavy blow':'attacks'} for ${d}.`)}
      render();setTimeout(endEnemyTurn,t==='multi'?n*110+350:450);
    },hitAt);
    return;
  }
  if(t==='def'){E.block+=v;log(`${def.name} braces for ${v} block.`);Stage.enemyRing('#59c9c2');Stage.float('enemy',`+${v}`,'#59c9c2','BLOCK')}
  else if(t==='buff'){E.str+=v;log(`${def.name} grows stronger (+${v} attack).`);Stage.enemyBurst('#e8574d',16);Stage.float('enemy',`+${v}`,'#e8574d','ATTACK UP')}
  else if(t==='heal'){const h=Math.min(v,E.max-E.hp);E.hp+=h;log(`${def.name} recovers ${h} HP.`);Stage.enemyBurst('#7fe08a',16);Stage.float('enemy',`+${h}`,'#7fe08a','HEAL')}
  render();setTimeout(endEnemyTurn,wait);
}
function endEnemyTurn(){
  const E=S.enemy;
  E.chill=Math.max(0,E.chill-1);
  if(S.hp<=0){S.hp=0;Stage.playerDie();render();setTimeout(()=>{S.phase='over';render()},1100);return}
  S.block=stats().def;S.turns++;drawHand();S.busy=false;
  render();
}
function winBattle(){
  const def=ENEMIES[S.enemy.id];S.kills++;
  if(def.boss){S.phase='win';render();return}
  const h=Math.min(5+(stats().regen||0),S.maxHp-S.hp);S.hp+=h;
  const loot=Math.random()<.8?rollLoot():null;
  S.reward={offers:pickN(3),healed:h,name:def.name,loot};Stage.pose('celebrate',1100);
  if(loot)Stage.drop(loot.key,loot.rarity,500);
  S.phase='reward';render();
}
function advance(){
  S.node++;
  if(S.node>=ROUTE.length){S.phase='win';render();return}
  travel();
}

/* ================= events ================= */
function startEvent(id){S.ev={id,step:'main',msg:null,offers:id==='merchant'?pickN(3):null,offer:null};S.phase='event';S.busy=false;render()}
function evOption(i){
  const ev=S.ev;
  if(ev.id==='shrine'){
    if(i===0){const h=Math.min(20,S.maxHp-S.hp);S.hp+=h;ev.msg=`Warm light settles over you. You heal ${h} HP.`;Stage.playerBurst('#fff0b3')}
    else if(i===1){addCard('holy');ev.msg='The altar answers your offering. You gain a Holy card.';Stage.playerBurst('#fff0b3')}
    else{const c=rnd(S.deck);c.lvl++;ev.msg=`A moment of clarity. Your ${D(c).name} card is now +${c.lvl-1} (power ${pow(c)}).`;Stage.playerBurst('#dba64b')}
    ev.step='done';
  }else if(ev.id==='smith'){
    if(i===0)ev.step='temper';else{advance();return}
  }else if(ev.id==='merchant'){
    if(i===0){S.baseMax+=8;S.maxHp+=8;S.hp=Math.max(1,S.hp-6);ev.msg='The tonic burns going down. Max HP +8, but you lose 6 HP.';ev.step='done';Stage.playerBurst('#7fe08a')}
    else{advance();return}
  }else if(ev.id==='chest'){
    if(i===0){
      const k=rnd(Object.keys(CARDS));addCard(k);
      if(Math.random()<.65){ev.loot=rollLoot(3);ev.msg=`Inside is a ${CARDS[k].name} card, and something else glinting underneath.`;Stage.drop(ev.loot.key,ev.loot.rarity,0)}
      else{S.hp=Math.max(1,S.hp-8);ev.msg=`It was a mimic! It bites for 8 before you pry a ${CARDS[k].name} card from its teeth.`;Stage.hitPlayer(false);Stage.float('player','-8','#ff6b5e','')}
      ev.step='done';
    }else{advance();return}
  }
  render();
}
function evCard(id){
  const ev=S.ev,c=card(id);
  if(ev.step==='temper'){c.lvl++;ev.msg=`The smith hammers your ${D(c).name} card. It is now +${c.lvl-1} (power ${pow(c)}).`;ev.step='done';Stage.playerBurst('#dba64b')}
  else if(ev.step==='give'){S.deck=S.deck.filter(x=>x.id!==id);addCard(ev.offer);ev.msg=`You trade away ${D(c).name} and receive ${CARDS[ev.offer].name}.`;ev.step='done'}
  render();
}

/* ================= render ================= */
function cardHTML(c,o={}){
  const d=D(c);
  return `<button type="button" class="card ${o.sel?'is-sel':''}" ${o.act?`data-act="${o.act}"`:''} ${o.i!=null?`data-i="${o.i}"`:''} data-id="${c.id??''}" data-key="${c.key}" style="--tc:${typeColor(c.key)}" aria-label="${d.name} card, power ${pow(c)}">
    <span class="card-top"><span class="card-cat">${CATLABEL[d.cat]}</span><span class="card-pow num">${pow(c)}</span></span>
    <span class="card-icon">${icon(c.key)}</span>
    <span class="card-name">${d.name}${(c.lvl||1)>1?` <i>+${c.lvl-1}</i>`:''}</span>
    <span class="card-desc">${d.desc}</span></button>`;
}
function routeHTML(){
  return `<nav class="route" aria-label="Route">${ROUTE.map((n,i)=>{
    const done=i<S.node||(S.phase==='win'),cur=i===S.node&&S.phase!=='title'&&S.phase!=='win';
    const boss=n.k==='e'&&ENEMIES[n.id].boss;
    const label=n.k==='e'?ENEMIES[n.id].name:EVENTS[n.id].name;
    const short=n.k==='e'?(boss?'B':i+1):'?';
    return `${i?`<span class="link ${done||cur?'done':''}"></span>`:''}<div class="node ${n.k==='v'?'ev':''} ${boss?'boss':''} ${done?'done':''} ${cur?'cur':''}" title="${label}"><span class="node-dot"><span>${short}</span></span><span class="node-label">${cur||done?label:(n.k==='v'?'Event':boss?'Boss':'Enemy')}</span></div>`;
  }).join('')}</nav>`;
}
function affHTML(E){
  const mods=ENEMIES[E.id].mods;const weak=[],res=[];
  Object.entries(mods).forEach(([t,m])=>{
    const known=E.known.includes(t);
    const chip=known?`<span class="chip ${m===0?'imm':m>1?'weak':'res'}"><span style="color:${typeColor(t)}">${icon(t)}</span>${TYPENAME[t]} ×${m}</span>`:`<span class="chip unk">?</span>`;
    (m>1?weak:res).push(chip);
  });
  return `<div class="aff"><span class="eyebrow">Weak</span><div class="chips">${weak.join('')||'<span class="chip unk">none</span>'}</div><span class="eyebrow">Resists</span><div class="chips">${res.join('')||'<span class="chip unk">none</span>'}</div></div>`;
}
function statusHTML(E){
  const s=[];
  if(E.block)s.push(`<span class="chip st" style="--tc:var(--guard)">Block ${E.block}</span>`);
  if(E.burn)s.push(`<span class="chip st" style="--tc:var(--fire)">Burn ${E.burn}</span>`);
  if(E.chill)s.push(`<span class="chip st" style="--tc:var(--ice)">Chill</span>`);
  if(E.stun)s.push(`<span class="chip st" style="--tc:var(--thunder)">Stunned</span>`);
  if(E.curse)s.push(`<span class="chip st" style="--tc:var(--shadow)">Curse ${E.curse}</span>`);
  if(E.str)s.push(`<span class="chip st" style="--tc:var(--danger)">Attack +${E.str}</span>`);
  return s.length?`<div class="chips">${s.join('')}</div>`:'';
}
function previewHTML(){
  if(S.sel.length<2)return `<div class="result"><p class="empty-hint">${S.sel.length?'Pick a second card to see the fusion.':'Pick two cards from your hand. Their fusion becomes this turn\'s action.'} Hit unknown weaknesses to reveal them.</p></div>`;
  const E=S.enemy,mods=ENEMIES[E.id].mods;const [c1,c2]=S.sel.map(card);const R=gearFuse(c1,c2);
  const isNew=!S.codex.some(x=>x.key===R.key);
  let est=0,unk=false;const lines=[];
  R.parts.forEach(p=>{
    const known=E.known.includes(p.t);const m=known?(mods[p.t]??1):1;if(!known)unk=true;
    let d=p.p*m;if(E.curse>0)d*=1.3;d=Math.round(d);est+=d;
    const tag=known?(m===0?' · immune':m>1?` · weak ×${m}`:m<1?` · resists ×${m}`:''):' · ?';
    lines.push(`<li style="color:${typeColor(p.t)}">${icon(p.t)}<span style="color:var(--ink)">${TYPENAME[p.t]} ${p.p}${tag}</span></li>`);
  });
  if(R.bonus>0)lines.push(`<li style="color:var(--brass)">${icon('guard')}<span style="color:var(--muted)">Gear adds +${R.bonus} damage</span></li>`);
  if(R.breaker)lines.push(`<li>${icon('blunt')}<span>Two techniques: ignores enemy block</span></li>`);
  if(R.block)lines.push(`<li style="color:var(--guard)">${icon('guard')}<span style="color:var(--ink)">Gain ${R.block} block</span></li>`);
  if(R.heal)lines.push(`<li style="color:var(--mend)">${icon('mend')}<span style="color:var(--ink)">Heal ${R.heal}</span></li>`);
  [...new Set(R.fx)].forEach(f=>lines.push(`<li style="color:${typeColor(f)}">${icon(f)}<span style="color:var(--muted)">${FXTEXT[f]}${R.fx.filter(x=>x===f).length>1?' (doubled)':''}</span></li>`));
  return `<div class="result"><div class="eyebrow">Fusion${R.parts.length?` · <span class="est" style="color:var(--ink)">${unk?'≈':''}${est}</span> damage`:''}</div>
    <h3>${R.name}${isNew?'<span class="new-tag">NEW</span>':''}</h3><ul>${lines.join('')}</ul>
    <div class="result-actions"><button type="button" class="btn btn-primary" data-act="fuse" ${S.busy?'disabled':''}>Fuse &amp; strike</button><button type="button" class="btn" data-act="clear" ${S.busy?'disabled':''}>Clear</button></div></div>`;
}
function battleHTML(){
  const E=S.enemy,d=ENEMIES[E.id],it=intentText(E);
  const slot=i=>{const id=S.sel[i];return id?`<div class="slot filled">${cardHTML(card(id),{act:'unsel'})}</div>`:`<div class="slot">Card ${i+1}</div>`};
  return `<section class="arena">
    <div class="panel"><div class="eyebrow">${d.boss?'Boss':'Enemy'} · stop ${S.node+1} of ${ROUTE.length}</div>
      <h2 class="enemy-name">${d.name}</h2><p class="lore">${d.lore}</p>
      <div class="hp-row"><span class="eyebrow">HP</span><span class="num">${Math.max(0,E.hp)} / ${E.max}</span></div>
      <div class="bar"><i style="width:${Math.max(0,E.hp)/E.max*100}%"></i></div>
      ${statusHTML(E)}
      <div class="intent ${it.cls}"><span class="eyebrow">Next</span><span>${it.label}</span><b class="num">${it.val}</b></div>
      ${affHTML(E)}</div>
    <div class="panel player">
      <div class="eyebrow">You</div><h3>The Fuser</h3>
      <div class="hp-row"><span class="eyebrow">HP</span><span class="num">${S.hp} / ${S.maxHp}</span></div>
      <div class="bar me"><i style="width:${S.hp/S.maxHp*100}%"></i></div>
      <div class="stat-line"><span class="block-badge">${icon('guard')}${S.block}</span><span>Deck <b>${S.deck.length}</b></span><span>Recipes <b>${S.codex.length}</b></span></div>
      <div style="margin-top:12px">${gearHTML()}</div>
      <div class="log" aria-live="polite">${S.log.map(l=>`<p>${l}</p>`).join('')}</div>
    </div>
  </section>
  <section class="panel forge" aria-label="Fusion">${slot(0)}<span class="op">+</span>${slot(1)}<span class="op">=</span>${previewHTML()}</section>
  <section><div class="hand ${S.busy?'locked':''}">${S.hand.map(id=>cardHTML(card(id),{act:'sel',sel:S.sel.includes(id)})).join('')}</div>
  <div class="hand-meta"><span>Draw pile <b class="num">${S.draw.length}</b></span><span>Discard <b class="num">${S.disc.length}</b></span><span>Turn <b class="num">${S.turns+1}</b></span></div></section>`;
}
function titleHTML(){
  const ex=k=>cardHTML({key:k,lvl:1});
  return `<section class="screen">
    <div class="eyebrow">A fusion card road</div>

  </section>`;
}
function travelHTML(){
  const n=ROUTE[S.node];
  return `<section class="screen"><div class="travel"><span class="eyebrow">On the road</span><span>Heading to stop <b>${S.node+1}</b> of ${ROUTE.length}…</span></div>${deckHTML()}</section>`;
}
function rewardHTML(){
  const r=S.reward;
  return `<section class="screen"><div class="eyebrow">Victory</div><h2>${r.name} defeated</h2>
    <p>${r.healed?`You catch your breath and heal ${r.healed} HP.`:''}${r.loot?' It dropped something.':''}</p>
    ${lootHTML(r.loot)}
    <p>Choose one card to add to your deck.</p>
    <div class="card-row">${r.offers.map(k=>cardHTML({key:k,lvl:1},{act:'reward'})).join('')}</div>
    <div><button type="button" class="btn" data-act="skip">Skip the card</button></div>
    ${deckHTML()}</section>`;
}
function lootHTML(L){
  if(!L)return '';
  const it=ITEMS[L.key];
  if(L.done)return `<div class="loot ${L.rarity}">${itemIcon(L.key,48)}<div class="loot-body"><p>${L.msg}</p></div></div>`;
  const cur=it.slot?S.gear[it.slot]:null;
  return `<div class="loot ${it.slot?L.rarity:'common'}">${itemIcon(L.key,80)}<div class="loot-body">
    <div class="eyebrow">Loot · ${it.slot?SLOTNAME[it.slot]:'Potion'}</div>
    <h3>${it.name}${it.slot?`<span class="rar ${L.rarity}">${L.rarity}</span>`:''}</h3>
    <ul class="stats">${statLines(L.stats).map(x=>`<li>${x}</li>`).join('')}</ul>
    ${it.slot?`<p class="compare">${cur?`Replaces your ${ITEMS[cur.key].name}: ${statLines(cur.stats).join(', ')}.`:'Nothing equipped in this slot yet.'}</p>`:''}
    <div class="result-actions" style="margin-top:6px"><button type="button" class="btn btn-primary" data-act="lootuse">${it.slot?'Equip':'Drink it'}</button><button type="button" class="btn" data-act="lootleave">Leave it</button></div>
  </div></div>`;
}
function gearHTML(){
  const g=stats();const sum=[];
  if(g.atk)sum.push(`Attack <b>+${g.atk}</b>`);if(g.def)sum.push(`Block/turn <b>+${g.def}</b>`);if(g.hp)sum.push(`Max HP <b>+${g.hp}</b>`);if(g.regen)sum.push(`Regen <b>+${g.regen}</b>`);
  Object.keys(TYPENAME).forEach(t=>{if(g[t])sum.push(`${TYPENAME[t]} <b>+${g[t]}</b>`)});
  return `<div class="gear">${Object.keys(SLOTNAME).map(sl=>{const it=S.gear[sl];return it?`<span class="slotbox ${it.rarity}" title="${ITEMS[it.key].name} (${it.rarity}): ${statLines(it.stats).join(', ')}">${itemIcon(it.key,32)}</span>`:`<span class="slotbox empty" title="${SLOTNAME[sl]}: empty">${SLOTSHORT[sl]}</span>`}).join('')}</div>
    <div class="gear-sum">${sum.length?sum.join(' · '):'No gear yet. Monsters drop items when defeated.'}</div>`;
}
function deckHTML(act){
  return `${act?'':`<div><div class="eyebrow" style="margin-bottom:8px">Gear</div>${gearHTML()}</div>`}<div><div class="eyebrow" style="margin-bottom:8px">${act?'Choose a card':'Your deck'} · ${S.deck.length} cards · HP ${S.hp}/${S.maxHp}</div><div class="card-row">${S.deck.map(c=>cardHTML(c,act?{act}:{})).join('')}</div></div>`;
}
function eventHTML(){
  const ev=S.ev,E=EVENTS[ev.id];
  let body='';
  if(ev.step==='done')body=`<p style="font-size:17px">${ev.msg}</p>${lootHTML(ev.loot)}<div><button type="button" class="btn btn-primary" data-act="continue">Continue the road</button></div>${deckHTML()}`;
  else if(ev.step==='temper')body=`<p>Tap a card to temper it. It gains +2 power.</p>${deckHTML('evcard')}`;
  else if(ev.step==='give')body=`<p>You chose <b>${CARDS[ev.offer].name}</b>. Now tap the card you'll give in exchange.</p>${deckHTML('evcard')}<div><button type="button" class="btn" data-act="evback">Back</button></div>`;
  else{
    const opts={
      shrine:[['Pray','Heal up to 20 HP.'],['Make an offering','Gain a Holy card.'],['Meditate','Upgrade a random card in your deck (+2 power).']],
      smith:[['Temper a card','Choose any card. It gains +2 power.'],['Move on','Leave the smith behind.']],
      merchant:[['Buy a tonic','Max HP +8, but lose 6 HP now.'],['Move on','Leave without trading.']],
      chest:[['Open it','Probably cards. Possibly teeth.'],['Leave it','Some chests are better left shut.']]
    }[ev.id];
    body=`${ev.id==='merchant'?`<div><div class="eyebrow" style="margin-bottom:8px">Trade one of your cards for</div><div class="card-row">${ev.offers.map(k=>cardHTML({key:k,lvl:1},{act:'evoffer'})).join('')}</div></div>`:''}
      <div class="options">${opts.map((o,i)=>`<button type="button" class="opt" data-act="evopt" data-i="${i}"><b>${o[0]}</b><span>${o[1]}</span></button>`).join('')}</div>`;
  }
  return `<section class="screen"><div class="eyebrow">Event · stop ${S.node+1} of ${ROUTE.length}</div><h2>${E.name}</h2><p>${E.text}</p>${body}</section>`;
}
function endHTML(win){
  const at=ROUTE[Math.min(S.node,ROUTE.length-1)];
  return `<section class="screen"><div class="eyebrow">${win?'The road is cleared':'Fallen'}</div>
    <h2>${win?'The Ember Monarch falls':`Defeated by the ${ENEMIES[at.id].name}`}</h2>
    <p>${win?'The old fire goes out. You walk the rest of the road in quiet.':`You made it to stop ${S.node+1} of ${ROUTE.length}.`}</p>
    <div class="stat-line" style="font-size:15px"><span>Enemies defeated <b>${S.kills}</b></span><span>Turns <b>${S.turns}</b></span><span>Recipes found <b>${S.codex.length} / ${TOTAL_RECIPES}</b></span><span>Deck <b>${S.deck.length}</b></span></div>
    <div><button type="button" class="btn btn-primary" data-act="restart">${win?'Play again':'Try again'}</button></div>${deckHTML()}</section>`;
}
function codexHTML(){
  if(!S.codexOpen)return '';
  return `<div class="modal" data-act="closecodex"><div class="modal-box" role="dialog" aria-label="Recipe codex" data-stop="1">
    <div class="modal-head"><h2 style="font-size:28px;color:var(--brass)">Recipe codex</h2><button type="button" class="btn" data-act="closecodex">Close</button></div>
    <p class="eyebrow">${S.codex.length} of ${TOTAL_RECIPES} fusions discovered</p>
    <div class="codex" style="margin:10px 0 18px">${S.codex.map(r=>`<div><b>${r.name}</b><span>${r.a} + ${r.b}</span></div>`).join('')||'<div><span>No fusions yet. Fuse any two cards to record one.</span></div>'}</div>
    <h3 style="font-size:20px">Element effects</h3>
    <table class="guide"><tbody>${Object.entries(FXTEXT).map(([k,v])=>`<tr><td style="color:${typeColor(k)}">${TYPENAME[k]}</td><td>${v}</td></tr>`).join('')}</tbody></table>
  </div></div>`;
}
const $top=document.getElementById('top'),$main=document.getElementById('main'),$modal=document.getElementById('modal'),$label=document.getElementById('stageLabel');
function render(){
  let main='';
  const ph=S.phase;
  if(ph==='title')main=titleHTML();
  else if(ph==='travel')main=travelHTML();
  else if(ph==='battle')main=battleHTML();
  else if(ph==='reward')main=rewardHTML();
  else if(ph==='event')main=eventHTML();
  else if(ph==='over')main=endHTML(false);
  else if(ph==='win')main=endHTML(true);
  $top.innerHTML=`<header class="top"><div class="brand"><h1>Fusebound</h1><span class="eyebrow">The road to the Ember Monarch</span></div>
    <div class="top-actions"><button type="button" class="btn" data-act="codex">Codex <span class="num">${S.codex.length}/${TOTAL_RECIPES}</span></button>${ph!=='title'?'<button type="button" class="btn" data-act="restart">Restart</button>':''}</div></header>${routeHTML()}`;
  $main.innerHTML=main;
  $modal.innerHTML=codexHTML();
  const n=ROUTE[S.node];
  $label.textContent=ph==='title'?'':ph==='win'?'Road cleared':ph==='travel'?'On the road':n?(n.k==='e'?ENEMIES[n.id].name:EVENTS[n.id].name):'';
  const cur=$top.querySelector('.node.cur');if(cur)cur.scrollIntoView({block:'nearest',inline:'center'});
}

document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='closecodex'&&e.target.closest('[data-stop]')&&!e.target.closest('button'))return;
  const act=b.dataset.act,id=+b.dataset.id;
  switch(act){
    case 'start':S.node=0;travel();break;
    case 'sel':
      if(S.busy)return;
      if(S.sel.includes(id))S.sel=S.sel.filter(x=>x!==id);
      else if(S.sel.length<2)S.sel.push(id);
      else S.sel=[S.sel[0],id];
      render();break;
    case 'unsel':if(S.busy)return;S.sel=S.sel.filter(x=>x!==id);render();break;
    case 'clear':S.sel=[];render();break;
    case 'fuse':doFuse();break;
    case 'reward':addCard(b.dataset.key);advance();break;
    case 'skip':advance();break;
    case 'evopt':evOption(+b.dataset.i);break;
    case 'evoffer':S.ev.offer=b.dataset.key;S.ev.step='give';render();break;
    case 'evback':S.ev.step='main';render();break;
    case 'evcard':evCard(id);break;
    case 'continue':advance();break;
    case 'lootuse':useLoot();break;
    case 'lootleave':leaveLoot();break;
    case 'codex':S.codexOpen=true;render();break;
    case 'closecodex':S.codexOpen=false;render();break;
    case 'restart':newGame();Stage.reset();render();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.codexOpen){S.codexOpen=false;render()}});

function start(data){
  if(data&&data.S){
    S=data.S;S.busy=false;if(!S.gear){S.gear={};S.perm={atk:0,def:0};S.baseMax=S.maxHp}
    const n=ROUTE[S.node];
    if(S.phase==='travel'){travel();return}
    if(S.phase==='battle')Stage.place('e',n.id);
    else if(S.phase==='event')Stage.place('v',n.id);
    else Stage.place(null);
    if(S.phase==='over')Stage.playerDie();
    if(S.phase==='win')Stage.reset();
  }else newGame();
  render();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
